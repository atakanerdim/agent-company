name: shift
on:
  schedule:
    # Deliberately not on the hour. Runners are queued when every cron in the world
    # fires at :00, and the free model tiers are busiest at exactly that minute.
    - cron: "17 6 * * *"
    # A second attempt. The free tiers are busiest on the hour and the company
    # otherwise gets exactly one shot a day; a shift that already delivered is
    # skipped below, so this only picks up the ones that fell over.
    - cron: "37 14 * * *"
  workflow_dispatch:
    inputs:
      agent:
        description: "single agent id (empty = whole day's roster)"
        required: false
        default: ""
      probe_only:
        description: "only probe the provider chain — no shift, no PR"
        type: boolean
        required: false
        default: false
permissions:
  contents: write
  pull-requests: write
  models: read
concurrency:
  group: shift
  cancel-in-progress: false
jobs:
  shift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.AJAN_PAT }}
          fetch-depth: 0
      - name: probe-chain
        if: ${{ inputs.probe_only }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          # The chain can only be measured from here. A provider that answers a
          # laptop can still refuse a datacentre address, which is why a failure
          # seen in a shift may never reproduce locally.
          python kernel/healthcheck.py || echo "::warning::a link of the chain is down"
          git checkout -- . || true
      - name: day-and-roster
        if: ${{ !inputs.probe_only }}
        id: roster
        run: |
          DAY=$(date -u +%a | tr 'A-Z' 'a-z')
          echo "day=$DAY" >> "$GITHUB_OUTPUT"
          if [ -n "${{ inputs.agent }}" ]; then
            echo "agents=${{ inputs.agent }}" >> "$GITHUB_OUTPUT"
          else
            echo "agents=$(python kernel/runner.py --list --day "$DAY" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          fi
      - name: run-shifts
        if: ${{ !inputs.probe_only }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN || secrets.GITHUB_TOKEN }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          GH_TOKEN: ${{ secrets.AJAN_PAT }}
          SHIFT_GAP_SEC: "20"
        run: |
          git config user.name "autonomous-studio-agent"
          git config user.email "agent@users.noreply.github.com"
          DATE=$(date -u +%F)
          DAY="${{ steps.roster.outputs.day }}"
          for A in ${{ steps.roster.outputs.agents }}; do
            git checkout main && git pull --quiet
            DELIVERED=$(gh pr list --state all --limit 100 --json title,headRefName \
              --jq "[.[]|select(.headRefName==\"shift/$A/$DATE\" and (.title|startswith(\"log:\")|not))]|length" || echo 0)
            [ "$DELIVERED" != "0" ] && { echo "$A already delivered $DATE"; continue; }
            BRANCH="shift/$A/$DATE"
            git checkout -B "$BRANCH"
            rm -f out/pr_queue.json
            SKIPPED=0
            python kernel/runner.py --agent "$A" --day "$DAY" || { SKIPPED=1; echo "::warning::$A skipped"; }
            git add -A
            git diff --cached --quiet && { echo "$A: no changes"; continue; }
            if [ "$SKIPPED" = "1" ]; then
              TITLE="log: $A shift skipped $DATE"
              BODY="The shift did not complete. See company/log/$DATE-$A.log for the reason."
              DRAFT="false"
            elif [ -f out/pr_queue.json ]; then
              TITLE=$(python -c 'import json;print(json.load(open("out/pr_queue.json"))[-1]["title"])')
              BODY=$(python -c 'import json;print(json.load(open("out/pr_queue.json"))[-1]["body"])')
              DRAFT=$(python -c 'import json;print(str(json.load(open("out/pr_queue.json"))[-1]["draft"]).lower())')
            else
              TITLE="$A: shift $DATE"; BODY="Autonomous shift output."; DRAFT="false"
            fi
            git commit -q -m "$TITLE"
            git push -f -q origin "$BRANCH"
            EXTRA=""; [ "$DRAFT" = "true" ] && EXTRA="--draft"
            gh pr create --head "$BRANCH" --title "$TITLE" --body "$BODY" $EXTRA || echo "::warning::$A PR not created (may already exist)"
          done
          git checkout main
      - name: model-healthcheck
        if: ${{ steps.roster.outputs.day == 'sun' && !inputs.probe_only }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.AJAN_PAT }}
        run: |
          git config user.name "autonomous-studio-agent"
          git config user.email "agent@users.noreply.github.com"
          git checkout main && git pull --quiet
          if python kernel/healthcheck.py; then echo "provider chain healthy"; exit 0; fi
          DATE=$(date -u +%F)
          BRANCH="health/$DATE"
          git checkout -B "$BRANCH"
          git add -A
          git diff --cached --quiet && { git checkout main; exit 0; }
          git commit -q -m "log: provider chain health $DATE"
          git push -f -q origin "$BRANCH"
          gh pr create --head "$BRANCH" --title "log: provider chain health $DATE" \
            --body "A link in the provider chain did not answer. See company/log/$DATE-health.log for the provider and model." \
            || echo "::warning::health PR not created (may already exist)"
          git checkout main
      - name: design-feedback
        if: ${{ (steps.roster.outputs.day == 'wed' || steps.roster.outputs.day == 'thu') && !inputs.probe_only }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.AJAN_PAT }}
        run: |
          NUM=$(gh pr list --state open --draft --json number,headRefName \
                --jq '[.[]|select(.headRefName|startswith("shift/designer"))][0].number' || true)
          [ -z "$NUM" ] || [ "$NUM" = "null" ] && { echo "no open design draft"; exit 0; }
          mkdir -p out
          gh pr diff "$NUM" > out/diff.txt || exit 0
          for R in pessimist webdev romantic; do
            python kernel/runner.py --agent "$R" --mode comment --input out/diff.txt || continue
            [ -f "out/comment-$R.txt" ] && gh pr comment "$NUM" --body-file "out/comment-$R.txt"
          done
          git checkout -- . || true
      - name: saturday-design-revision
        if: ${{ steps.roster.outputs.day == 'sat' && !inputs.probe_only }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.AJAN_PAT }}
        run: |
          NUM=$(gh pr list --state open --draft --json number,headRefName \
                --jq '[.[]|select(.headRefName|startswith("shift/designer"))][0].number' || true)
          [ -z "$NUM" ] || [ "$NUM" = "null" ] && { echo "no draft to revise"; exit 0; }
          BRANCH=$(gh pr view "$NUM" --json headRefName --jq .headRefName)
          mkdir -p out
          gh pr view "$NUM" --json comments --jq '[.comments[].body]|join("\n---\n")' > out/comments.txt || true
          git fetch origin "$BRANCH" && git checkout "$BRANCH"
          # Revising the draft and letting it out of draft are two different things.
          # They used to be one line apart behind the same `|| exit 0`, so a single
          # failed model call left the draft a draft for ever: between 2026-08-17
          # and 2026-09-03 not one design change reached main. A draft that nobody
          # could improve this week is still a draft that colleagues have read and
          # the checks can judge. It goes forward either way.
          if python kernel/runner.py --agent designer --day sat --mode revision --input out/comments.txt; then
            git config user.name "autonomous-studio-agent"
            git config user.email "agent@users.noreply.github.com"
            git add -A
            git diff --cached --quiet || { git commit -q -m "designer: feedback revision"; git push -q origin "$BRANCH"; }
          else
            echo "::warning::designer revision did not run; the draft goes ready as it stands"
            git checkout -- . || true
          fi
          gh pr ready "$NUM"
