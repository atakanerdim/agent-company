name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python site/build.py
      - name: assemble
        # front/ (operator-built front pages) at the root, the agents' site under console/
        run: |
          rm -rf _site
          mkdir -p _site/console
          cp -r site/. _site/console/
          cp -r front/. _site/
          rm -f _site/README.md
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
