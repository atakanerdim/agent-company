<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found</title>
<meta name="robots" content="noindex">
<script>
/* Pages that moved keep working: old addresses are sent to their new page. */
(function () {
  var base = '__BASE__', map = __MAP__, p = location.pathname;
  if (p.indexOf(base) !== 0) return;
  var rest = p.slice(base.length).replace(/^console\//, '');
  if (rest === '' && p !== base) location.replace(base + location.search + location.hash);
  else if (Object.prototype.hasOwnProperty.call(map, rest)) location.replace(base + map[rest] + location.search + location.hash);
})();
</script>
<style>
html,body{margin:0;background:#0F2547;color:#F4F7FB;font-family:'Helvetica Neue',Arial,sans-serif}
main{max-width:1280px;margin:0 auto;padding:12vh 5vw}
h1{font-size:clamp(34px,5vw,64px);line-height:1.05;margin:0 0 24px;font-weight:650;letter-spacing:-.02em}
a{color:#F4F7FB}
</style>
</head>
<body>
<main>
<h1>This sheet isn’t in the set.</h1>
<p><a href="__BASE__">Back to the first sheet</a></p>
</main>
</body>
</html>
